<!DOCTYPE html>
<html>
<head>
  <title>For Dharna ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff4e8a, #ffb6c1);
      text-align: center;
      color: white;
      overflow: hidden;
    }

    .container {
      display: none;
      padding: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    img {
      width: 80%;
      max-width: 300px;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 0 20px rgba(255,255,255,0.6);
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #ff4e8a;
      cursor: pointer;
      margin-top: 20px;
    }

    #letter {
      display: none;
      margin-top: 20px;
      font-size: 18px;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    .password-box {
      margin-top: 40vh;
    }

    input {
      padding: 10px;
      border-radius: 20px;
      border: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="password-box">
  <h2>Enter Secret Code ❤️</h2>
  <input type="password" id="pass" placeholder="Enter password">
  <br><br>
  <button onclick="checkPass()">Unlock</button>
</div>

<div class="container" id="mainContent">
  <h1>Happy Rose Day 🌹 Dharna ❤️</h1>
  <img src="photo1.jpg">
  <br>
  <button onclick="showLetter()">Open My Heart 💌</button>

  <div id="letter">
    <p>
      Dharna ❤️<br><br>
      You are the most beautiful part of my life.<br>
      Every smile of yours makes my world brighter 🌸<br><br>
      Happy Rose Day my love 🌹<br>
      Forever Yours,<br>
      Ayush ❤️
    </p>
  </div>
</div>

<audio autoplay loop>
  <source src="https://www2.cs.uic.edu/~i101/SoundFiles/StarWars60.wav" type="audio/wav">
</audio>

<script>
  function checkPass() {
    var password = document.getElementById("pass").value;
    if(password === "dharna123") {
      document.querySelector(".password-box").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    } else {
      alert("Wrong password ❤️");
    }
  }

  function showLetter() {
    document.getElementById("letter").style.display = "block";
  }
</script>

</body>
</html>
